# MMO Vault — der Serverbetrieb.
#
#   docker compose run --rm mmo-vault-server setup   → einmalig einrichten
#   docker compose up -d --build                     → http://127.0.0.1:4081/
#
# Die andere Betriebsart braucht kein Compose und keinen Container: die Datei
# mmo_vault/public_html/mmo_vault.html im Browser öffnen, fertig.
#
# Gedacht als Backend hinter einem Reverse Proxy, der TLS terminiert. Ohne
# HTTPS ist die Anwendung nur über localhost benutzbar: crypto.subtle existiert
# außerhalb eines Secure Context nicht, und die Identity Provider akzeptieren
# nur https-Redirect-URIs.
#
# Abweichender Port oder Bind-Adresse ohne Änderung dieser Datei:
#   VAULT_PORT=4081 VAULT_BIND=127.0.0.1 docker compose up -d
# oder dauerhaft in einer .env-Datei daneben.

services:
  mmo-vault-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mmo-vault-server:2.1.0
    container_name: mmo-vault-server
    # Startet nach einem Reboot automatisch wieder — vorausgesetzt, der
    # Docker-Dienst selbst ist aktiviert (systemctl enable docker).
    # "unless-stopped" statt "always": ein bewusst gestoppter Container bleibt
    # nach dem Neustart gestoppt.
    restart: unless-stopped

    # Erste Inbetriebnahme — einmalig, vor dem ersten Start:
    #   docker compose run --rm mmo-vault-server setup
    # Fragt Origin, den primären Identity Provider (Microsoft, Google oder
    # generisch) und die ersten Administratoren ab und schreibt alles in die
    # Datenbank. Es gibt keine Konfigurationsdatei; alles Weitere passiert
    # in der Verwaltung unter /admin.
    #
    # Die einzigen Umgebungsvariablen, die der Dienst liest. Vorgaben stehen
    # im Dockerfile; hier nur überschreiben, wenn z. B. eine externe
    # Datenbank angebunden wird.
    environment:
      MMO_VAULT_DIR: /app/var
      MMO_VAULT_DATABASE_URL: ${MMO_VAULT_DATABASE_URL:-sqlite:////app/var/mmo_vault.db}

    # Die Bind-Adresse 127.0.0.1 ist hier die eigentliche Zugriffsbeschränkung.
    # WICHTIG: Ohne sie — also bei "4081:8000" — trägt Docker eigene
    # iptables-Regeln VOR die Ketten von ufw/firewalld ein. Der Port wäre dann
    # aus dem Netz erreichbar, obwohl die Firewall ihn scheinbar sperrt.
    # Läuft der Reverse Proxy in einem eigenen Container, kann er die
    # Host-Loopback-Adresse nicht erreichen: dann diese Freigabe ganz entfernen,
    # das Proxy-Netz unten einkommentieren und dort auf
    # http://mmo-vault-server:8000 zeigen — ohne jede Portveröffentlichung.
    ports:
      - "${VAULT_BIND:-127.0.0.1}:${VAULT_PORT:-4081}:8000"

    # networks:
    #   - proxy

    volumes:
      # Der einzige Ort, an dem geschrieben wird: Datenbank (samt aller
      # Einstellungen und Provider-Secrets) und die Vault-Dateien samt
      # Generationen.
      - vault-data:/app/var

    # Härtung: Außerhalb des Datenverzeichnisses schreibt der Dienst nicht und
    # braucht dafür weder Schreibrechte im Wurzeldateisystem noch Capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Python, SQLAlchemy und der Upload einer Vault-Datei bis zur
    # konfigurierten Größe brauchen Platz.
    mem_limit: 256m
    pids_limit: 256

volumes:
  vault-data:

