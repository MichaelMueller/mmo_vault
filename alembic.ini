# Alembic from the start: retrofitting migrations onto a live database is
# considerably more expensive than carrying them along from the beginning.
# The database URL is not configured here - env.py takes it from var/config.toml
# so that there is exactly one place where it is defined.
[alembic]
script_location = mmo_vault/migrations
prepend_sys_path = .
# Without this Alembic falls back to splitting on spaces and colons, which
# breaks on Windows paths like C:\...
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
