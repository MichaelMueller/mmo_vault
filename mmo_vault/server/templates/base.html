<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<!-- Same rule as in the vault application: nothing from outside. Stylesheet,
     fonts and scripts come from this service and nowhere else, which is why
     the policy needs neither 'unsafe-inline' nor a single foreign host. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}MMO Vault{% endblock %}</title>
<link rel="stylesheet" href="/static/vault.css">
<!-- A data URI rather than a file: one request fewer, and no 404 in the log
     for a browser that asks for a favicon whether one exists or not. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f59e0b' d='M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z'/%3E%3C/svg%3E">
</head>
<body>
{% block bar %}{% endblock %}
<div class="wrap {% block wrapclass %}{% endblock %}">
{% block content %}{% endblock %}
</div>
<script src="/static/api.js"></script>
{% block scripts %}{% endblock %}
</body></html>
