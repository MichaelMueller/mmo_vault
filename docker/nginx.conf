# nginx-Konfiguration für MMO Vault.
#
# Ausgeliefert wird ein einzelnes statisches Dokument — kein Upstream, kein
# Schreibpfad, keine dynamischen Endpunkte. Die Konfiguration ersetzt die
# mitgelieferte /etc/nginx/nginx.conf vollständig, damit nichts aus conf.d/
# unbemerkt mitgreift.
#
# Läuft absichtlich als unprivilegierter Benutzer: keine "user"-Direktive
# (würde ohne root-Master nur eine Warnung erzeugen), Port oberhalb 1024 und
# alle Schreibpfade unter /tmp, sodass das Dateisystem read-only sein kann.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Sämtliche Temporärpfade nach /tmp — sonst scheitert der Start unter
    # read_only mit Schreibfehlern in /var/cache/nginx.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Container-Konvention: Logs nach stdout/stderr. Wer keine IP-Adressen
    # protokollieren möchte, setzt hier "access_log off;".
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Hinter einem Reverse Proxy zeigt das Log dessen Adresse. Wer die echte
    # Client-IP braucht, trägt hier das Netz des Proxys ein — nur dann, denn ein
    # zu weit gefasstes set_real_ip_from macht die Angabe fälschbar.
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header   X-Forwarded-For;
    # real_ip_recursive on;

    gzip              on;
    # text/html gehört hier NICHT hinein — nginx komprimiert es ohnehin immer und
    # meldet die Angabe als "duplicate MIME type".
    gzip_types        text/css application/javascript image/svg+xml;
    gzip_min_length   1024;

    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        # Eigenes Verzeichnis statt /usr/share/nginx/html: dort liegen im Basisimage
        # die nginx-Willkommensseite und 50x.html, die sonst mit ausgeliefert würden.
        root /srv/mmo-vault;

        # Der Index heißt mmo_vault.html, nicht index.html — deshalb ist die
        # Default-Konfiguration des Images nicht verwendbar.
        index mmo_vault.html;

        # Die Anwendung ist rein lesend. Alles andere braucht sie nicht.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # ---------------------------------------------------------------
        # Alle add_header bewusst NUR hier auf server-Ebene: sobald ein
        # verschachtelter location-Block ein eigenes add_header setzt, verwirft
        # nginx die geerbten Header dieses Blocks komplett. Ein einziger
        # Header-Satz für die eine ausgelieferte Datei umgeht das.
        # ---------------------------------------------------------------

        # Entspricht der CSP im <meta>-Tag der Anwendung, ergänzt um
        # frame-ancestors: diese Direktive wird in einem <meta>-Tag ignoriert
        # und lässt sich ausschließlich als HTTP-Header durchsetzen.
        # Mehrere CSP-Regelsätze gelten kumulativ — beide müssen passieren.
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options        "nosniff" always;
        add_header X-Frame-Options              "DENY" always;
        add_header Referrer-Policy              "no-referrer" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        # Nur abschalten, was die Anwendung nachweislich nicht nutzt. Insbesondere
        # clipboard-write bleibt erlaubt, sonst funktioniert das Kopieren nicht.
        add_header Permissions-Policy           "geolocation=(), camera=(), microphone=(), usb=(), payment=(), interest-cohort=()" always;

        # Der Vault ist Sicherheitssoftware: Nutzer sollen eine neue Version
        # sofort bekommen. "no-cache" heißt revalidieren, nicht "nie cachen" —
        # unveränderte Dateien liefert nginx per ETag als 304 aus.
        add_header Cache-Control "no-cache" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Ein Favicon liegt bewusst nicht im Image; ohne diese Regel taucht
        # bei jedem Aufruf ein 404 im Log auf.
        location = /favicon.ico {
            access_log off;
            return 204;
        }
    }
}
